apply plugin: 'com.android.application'

android {
    namespace 'com.workbuddy.xiangqi'
    compileSdk 34

    defaultConfig {
        applicationId "com.workbuddy.xiangqi"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 使用 debug 签名，保证可直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
